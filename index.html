<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f8fbfa;--card:#fff;--ink:#17262b;--muted:#5d6f76;--line:#d3e2df;--acc:#0f9d8f;--acc2:#0b7285;--soft:#e2f6f3;--ok:#178a5a;--oksoft:#ddf4e8;--bad:#cc3e4a;--badsoft:#fde7e9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
.wrap{max-width:760px;margin:auto;padding:0 14px}
.hero{background:linear-gradient(120deg,#d9f3ee,#e6f1ff);color:#0b4f66;padding:22px 0 18px;border-bottom:1px solid var(--line)}
.kick{letter-spacing:.18em;font-size:12px;font-weight:800;opacity:.85}
.hero h1{margin:4px 0;font-size:clamp(28px,7vw,42px);line-height:1.15}
.hero p{margin:0 0 10px;opacity:.92}
.tag{display:inline-block;background:#fff;color:#0b7285;border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:12px;font-weight:700;margin:0 6px 4px 0}
main{padding:14px 0 36px}

.stat{background:var(--bg);border-radius:12px;padding:8px 6px;text-align:center;font-size:12px;color:var(--muted)}

.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#f6c453);transition:width .25s}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:12px;cursor:pointer;touch-action:manipulation}
.btn.on,.btn.pri{background:linear-gradient(100deg,var(--acc2),var(--acc));border-color:transparent;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.big{width:100%;padding:13px;font-size:17px;margin-top:10px}
label{display:block;margin:10px 0;font-weight:600}
select,input[type=number]{font:inherit;margin-left:8px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.muted{color:var(--muted);font-size:13px}
.hide{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{background:var(--soft);color:var(--acc);font-weight:800;font-size:13px;padding:4px 12px;border-radius:99px}
.qmeta{color:var(--acc);font-size:12px;font-weight:800}
.qtext{white-space:pre-line;font-size:18px;font-weight:750;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;font:inherit;padding:12px;margin:8px 0;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;cursor:pointer;touch-action:manipulation}
.opt.sel{background:var(--soft);border-color:var(--acc)}
.opt.ok{background:var(--oksoft);border-color:var(--ok)}
.opt.bad{background:var(--badsoft);border-color:var(--bad)}

.explain{white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:14px;margin-top:10px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.acts .btn{flex:1;min-width:90px}
.score{font-size:38px;font-weight:900;color:var(--acc)}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
@media(max-width:480px){.qtext{font-size:16px}}
</style></head><body>

 return shuffle(out)}

const $=id=>document.getElementById(id);
